<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🎉 Birthday Quest</title>
  <style>
    :root{ --bg:#0f0f12; --card:#17171c; --muted:#a3a3b2; --accent:#e95d8c; --ok:#43d17d; }
    *{box-sizing:border-box}
    body{margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial,"Noto Sans",sans-serif; background:var(--bg); color:#f7f7fb; line-height:1.45}
    .center{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:20px}
    .hidden{display:none}
    .app{max-width:900px; margin:0 auto; padding:24px 16px 64px; text-align:center}
    .card{background:var(--card); border-radius:20px; padding:24px; box-shadow:0 10px 30px #00000070; animation:fadeIn .4s ease}
    input,button{padding:12px 14px; border-radius:12px; border:none; font-size:16px}
    input{width:min(460px,92vw); text-align:center; background:#0d0d10; color:#fff; border:1px solid #2a2a33}
    button{background:var(--accent); color:#fff; cursor:pointer; font-weight:600; transition:transform .08s ease, background .25s ease}
    button:hover{background:#ff77a8}
    button:active{transform:translateY(1px)}
    .ghost{background:#2a2a33}
    .row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:10px}
    .hint-badge{display:inline-block; background:#2a2a33; color:#fff; padding:8px 14px; border-radius:999px; margin-top:12px; font-size:14px; animation:fadeIn .3s ease}
    .msg{margin-top:10px; font-size:14px}
    .ok{color:var(--ok)} .err{color:#ff6b6b}
    .progress{height:8px; background:#20202a; border-radius:999px; overflow:hidden; margin:6px 0 18px}
    .progress .bar{height:100%; width:0%; background:linear-gradient(90deg, var(--accent), #8a6fe8)}
    @keyframes fadeIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
  </style>
</head>
<body>
  <!-- Пароль -->
  <div id="lock-screen" class="center">
    <h1 style="margin:0 0 8px">🔒 Доступ обмежений</h1>
    <p style="margin:0; color:var(--muted)">Як Сонечко тебе називає?</p>
    <div class="row" style="margin-top:10px">
      <input type="text" id="password" placeholder="Відповідь..." />
      <button id="btn-open">Відкрити</button>
    </div>
    <div id="lock-msg" class="msg err"></div>
  </div>

  <!-- Гра -->
  <div id="game" class="hidden">
    <div class="app">
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="card" id="card-container"></div>
    </div>
  </div>

<script>
/* ——— Дані ——— */
const STEPS = [
  { q: "Як ти мене називаєш з пісні?",
    answers: ["девочка пиздец","дєвочка піздец"],
    hint: "🎤 Подсказка: как у Oxxxymiron",
    prize: { title:"Вітальна листівка", text:"Почнемо з м'якого — але гарячого",
      links:[{label:"Відкрити листівку", href:"prizes/birthday-card.jpg"}] } },
  { q: "Якого числа і місяця ми познайомились? (прописом)",
    answers:["другого березня"],
    hint:"🌸 Весна, початок історії",
    prize:{ title:"Лист від мене (PDF)", text:"Я написала це спеціально для тебе",
      links:[{label:"Завантажити лист", href:"prizes/Letter.pdf"}] } },
  { q: "Як ти себе любиш називати? (підказка: С П О)",
    answers:["стара пойобана ондатра"],
    hint:"😈 Три слова, ініціали С-П-О",
    prize:{ title:"Оксідрочер — відео", text:"Трохи абсурду, трохи сміху",
      links:[{label:"Відтворити відео", href:"prizes/oxydrocher.mp4"}] } },
  { q: "Візьми кожну букву по черзі (1-ша, 2-га…), 'my nobby mate honor nowcz derbby  maverik bestival'",
    answers:["мотоцикл"],
    hint:"🏍 Дві колісні пристрасті…",
    prize:{ title:"Сертифікат на байк", text:"Поїхали!",
      links:[{label:"Відкрити сертифікат", href:"prizes/Certificate-Moto.jpg"}] } },
  { q: "Що я колись обіцяла подарувати тобі на день народження? (підказка: скоріш за все червоненькі)",
    answers:["трусики","панталки","плавки"],
    hint:"💋 Маленький текстиль із великим настроєм",
    prize:{ title:"Сертифікат на еротовари", text:"Використай мудро",
      links:[{label:"Відкрити сертифікат", href:"prizes/Certificate-tr.jpg"}] } },
  { q: "З якою квіткою тебе асоціювала Пані?",
    answers:["едельвейс","еделвейс"],
    hint:"🌼 Рідкісна гірська красуня",
    prize:{ title:"PlayMe (PDF)", text:"Легка пікантність",
      links:[{label:"Відкрити PDF", href:"prizes/PlayMe.pdf"}] } },
  { q: "Хто народжується у серпні? Не забувайте про це 😜",
    answers:["лев","діва","ти","я"],
    hint:"🦁 Між Левом і Дівою… або просто ТИ",
    prize:{ title:"Фінальне відео-привітання", text:"Натисни, щоб переглянути фінал",
      links:[{label:"Дивитись відео", href:"prizes/Z-DR.mp4"}] } },
];

/* ——— Логіка доступу ——— */
const normalize = s => (s||"").toLowerCase().trim().replace(/\s+/g,' ');
document.getElementById('btn-open').addEventListener('click', () => {
  const val = normalize(document.getElementById('password').value);
  if (['не зануда','незануда','не-зануда'].includes(val)) {
    document.getElementById('lock-screen').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');
    showStep();
  } else {
    document.getElementById('lock-msg').textContent = 'Хм… А точно Сонечко так казало? 😉';
  }
});
document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('btn-open').click(); });

/* ——— Рендер гри ——— */
let currentStep = 0;
const bar = () => document.getElementById('bar');
function updateProgress(){ bar().style.width = Math.round(currentStep/STEPS.length*100) + '%'; }

function renderHintArea(stepIdx){
  const step = STEPS[stepIdx];
  return `
    <div id="hint-wrap" class="hidden"><div class="hint-badge">${step.hint}</div></div>
    <div class="row">
      <button class="ghost" id="btn-hint" type="button">Показати підказку</button>
      <button class="ghost" id="btn-answer" type="button">Показати відповідь</button>
    </div>
  `;
}

function showStep(){
  const step = STEPS[currentStep];
  const container = document.getElementById('card-container');
  container.innerHTML = `
    <h2 style="margin:0 0 6px">${step.q}</h2>
    <input type="text" id="answer" placeholder="Відповідь...">
    <div class="row"><button id="btn-check" type="button">Відповісти</button></div>
    ${renderHintArea(currentStep)}
    <div id="msg" class="msg"></div>
  `;
  updateProgress();
  document.getElementById('btn-check').addEventListener('click', checkAnswer);
  document.getElementById('answer').addEventListener('keydown', e => { if(e.key==='Enter') checkAnswer(); });
  document.getElementById('btn-hint').addEventListener('click', () => document.getElementById('hint-wrap').classList.remove('hidden'));
  document.getElementById('btn-answer').addEventListener('click', () => { const i=document.getElementById('answer'); i.value = STEPS[currentStep].answers[0]; checkAnswer(); });
}

function checkAnswer(){
  const step = STEPS[currentStep];
  const val = normalize(document.getElementById('answer').value);
  const ok = step.answers.map(normalize).includes(val);
  const msg = document.getElementById('msg');

  if(ok){
    msg.textContent = 'Вірно!'; msg.className = 'msg ok';
    const linksHTML = step.prize.links.map(l => `
      <div class="row">
        <a href="${l.href}" target="_blank" rel="noopener"><button>У новій вкладці</button></a>
        ${l.href.toLowerCase().endsWith('.pdf') ? `<a href="${l.href}" download><button class="ghost">Завантажити PDF</button></a>` : ''}
      </div>`).join('');
    document.getElementById('card-container').innerHTML = `
      <h2 style="margin:0 0 6px">${step.prize.title}</h2>
      <p style="color:var(--muted)">${step.prize.text}</p>
      ${linksHTML}
      <div class="row"><button id="btn-next">Далі →</button></div>
    `;
    document.getElementById('btn-next').addEventListener('click', nextStep);
  } else {
    msg.textContent = 'Не зовсім… спробуй ще 😉'; msg.className = 'msg err';
  }
}

function nextStep(){
  currentStep++;
  if(currentStep < STEPS.length){ showStep(); }
  else {
    bar().style.width = '100%';
    document.getElementById('card-container').innerHTML = '<h2>Квест завершено! 🎉</h2><p>Ти пройшов усі завдання!</p>';
  }
}
</script>
</body>
</html>
