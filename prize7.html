<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>💘 Фінальний сюрприз — Z-DRnez.mp4</title>
  <style>
    :root{ --bg:#0f0f12; --card:#17171c; --muted:#a3a3b2; --accent:#e95d8c; }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:#f7f7fb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial,'Noto Sans',sans-serif}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:var(--card); border-radius:20px; padding:18px; box-shadow:0 10px 30px #00000070; max-width:980px; width:100%}
    h1{margin:6px 0 14px;font-size:clamp(22px,4vw,34px)}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    a.btn,button.btn{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:10px 14px;text-decoration:none;display:inline-block}
    a.ghost,button.ghost{background:#2a2a33;color:#fff;border-radius:12px;padding:10px 14px;text-decoration:none;display:inline-block}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>💘 Фінальний сюрприз — Z-DRnez.mp4</h1>
      <div class="content"><video src="assets/Z-DRnez.mp4" controls playsinline style="max-width:100%;border-radius:12px"></video></div>
      <div class="actions">
        <a class="ghost" href="index.html">⬅️ Повернутися до квесту</a>
      </div>
    </div>
  </div>
</body>
</html>
