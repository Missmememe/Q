<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🎉 Birthday Quest</title>
  <style>
    :root{ --bg:#0f0f12; --card:#17171c; --muted:#a3a3b2; --accent:#e95d8c; --ok:#43d17d; }
    *{box-sizing:border-box}
    body{margin:0; font-family:system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif; background:var(--bg); color:#f7f7fb; line-height:1.45}
    .center{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:20px}
    .hidden{display:none !important}
    .app{max-width:900px; margin:0 auto; padding:24px 16px 64px; text-align:center}
    .card{background:var(--card); border-radius:20px; padding:24px; box-shadow:0 10px 30px #00000070; animation:fadeIn .4s ease}
    input,button{padding:12px 14px; border-radius:12px; border:none; font-size:16px}
    input{width:min(460px,92vw); text-align:center; background:#0d0d10; color:#fff; border:1px solid #2a2a33}
    button{background:var(--accent); color:#fff; cursor:pointer; font-weight:600; transition:transform .08s ease, background .25s ease}
    button:hover{background:#ff77a8}
    button:active{transform:translateY(1px)}
    .ghost{background:#2a2a33}
    .row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:10px}
    .hint-badge{display:none; background:#2a2a33; color:#fff; padding:8px 14px; border-radius:999px; margin-top:12px; font-size:14px; animation:fadeIn .3s ease}
    .msg{margin-top:10px; font-size:14px}
    .ok{color:var(--ok)} .err{color:#ff6b6b}
    .progress{height:8px; background:#20202a; border-radius:999px; overflow:hidden; margin:6px 0 18px}
    .progress .bar{height:100%; width:0%; background:linear-gradient(90deg, var(--accent), #8a6fe8)}
    @keyframes fadeIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
  </style>
</head>
<body>
  <!-- GATE -->
  <div id="lock-screen" class="center">
    <div class="card">
      <h1 style="margin:0 0 8px">🔒 Доступ обмежений</h1>
      <p style="margin:0; color:var(--muted)">Як Сонечко тебе називає?</p>
      <div class="row" style="margin-top:10px">
        <input type="text" id="password" placeholder="Відповідь..." />
        <button id="btn-open">Відкрити</button>
      </div>
      <div id="lock-msg" class="msg err"></div>
    </div>
  </div>

  <!-- GAME -->
  <div id="game" class="hidden">
    <div class="app">
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="card">
        <div id="q"></div>
        <div id="hint" class="hint-badge"></div>
        <div class="row">
          <input type="text" id="answer" placeholder="Відповідь..." />
          <button id="btn-check">Відповісти</button>
        </div>
        <div class="row">
          <button id="btn-show-hint" class="ghost" type="button">Показати підказку</button>
        </div>
        <div id="msg" class="msg"></div>
      </div>
    </div>
  </div>

<script>
// ===== Data (prizes open on separate pages prizeN.html) =====
const STEPS = [
  { q: "Як ти мене називаєш з пісні?",
    answers: ["девочка пиздец","дєвочка піздец","девочка-пиздец"],
    hint: "🎤 Згадуй приспів 😉",
    prizePage: "prize1.html" },
  { q: "Якого числа і місяця ми познайомились? (прописом)",
    answers:["другого березня","2 березня","друге березня"],
    hint:"🌸 Весна, початок історії",
    prizePage: "prize2.html" },
  { q: "Як ти себе любиш називати? (С П О)",
    answers:["стара пойобана ондатра","спо","стара па* ондатра"],
    hint:"😈 3 слова, ініціали С-П-О",
    prizePage: "prize3.html" },
  { q: "Візьми кожну букву по черзі (1-ша, 2-га…): my nobby mate honor nowcz derbby  maverik bestival",
    answers:["мотоцикл","мотоциклі","мото"],
    hint:"🏍 Береш 1-шу, потім 2-гу…",
    prizePage: "prize4.html" },
  { q: "Що я колись обіцяла подарувати тобі на день народження? (скоріш за все червоненькі)",
    answers:["трусики","труси","червоні трусики","червоні труси"],
    hint:"💋 Маленький текстиль",
    prizePage: "prize5.html" },
  { q: "З якою квіткою тебе асоціювала Пані?",
    answers:["едельвейс","еделвейс","edelweiss"],
    hint:"🌼 Гірська красуня",
    prizePage: "prize6.html" },
  { q: "Хто народжується у серпні?",
    answers:["лев","діва","ти","він","я"],
    hint:"🦁 Між Левом і Дівою",
    prizePage: "prize7.html" },
];

// ===== Utils =====
const normalize = s => (s||"").toLowerCase().trim().replace(/\s+/g,' ');

// ===== Gate =====
document.getElementById('btn-open').addEventListener('click', () => {
  const val = normalize(document.getElementById('password').value);
  if (['не зануда','незануда','не-зануда','ne zanuda','ne-zanuda'].includes(val)) {
    document.getElementById('lock-screen').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');
    showStep();
  } else {
    document.getElementById('lock-msg').textContent = 'Хм… А точно Сонечко так казало? 😉';
  }
});
document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('btn-open').click(); });

// ===== Game state =====
let stepIndex = 0;
function updateProgress(){ document.getElementById('bar').style.width = Math.round(stepIndex/STEPS.length*100) + '%'; }

function showStep(){
  const s = STEPS[stepIndex];
  document.getElementById('q').innerHTML = `<h2 style="margin:0 0 6px">${s.q}</h2>`;
  document.getElementById('answer').value='';
  document.getElementById('msg').textContent='';
  const hintEl = document.getElementById('hint');
  hintEl.textContent = s.hint || '';
  hintEl.style.display = 'none';
  document.getElementById('btn-show-hint').textContent = 'Показати підказку';
  updateProgress();
}

document.getElementById('btn-show-hint').addEventListener('click', ()=>{
  const hintEl = document.getElementById('hint');
  const isShown = hintEl.style.display === 'block';
  hintEl.style.display = isShown ? 'none' : 'block';
  document.getElementById('btn-show-hint').textContent = isShown ? 'Показати підказку' : 'Сховати підказку';
});

function checkAnswer(){
  const s = STEPS[stepIndex];
  const val = normalize(document.getElementById('answer').value);
  const ok = s.answers.map(normalize).includes(val);
  const msg = document.getElementById('msg');
  if(ok){
    msg.textContent = 'Вірно! Відкриваю приз…'; msg.className = 'msg ok';
    const target = s.prizePage;
    // Зберігаємо прогрес і переходимо на сторінку призу
    stepIndex++; localStorage.setItem('bday-quest-progress', String(stepIndex));
    setTimeout(()=>{ location.href = target; }, 400);
  }else{
    msg.textContent = 'Не зовсім… спробуй ще 😉'; msg.className = 'msg err';
  }
}

document.getElementById('btn-check').addEventListener('click', checkAnswer);
document.getElementById('answer').addEventListener('keydown', e => { if(e.key==='Enter') checkAnswer(); });

// Відновлення прогресу (за бажанням)
const saved = parseInt(localStorage.getItem('bday-quest-progress')||'0',10);
if(!isNaN(saved) && saved>0 && saved<=STEPS.length){ stepIndex = saved; }

</script>
</body>
</html>
